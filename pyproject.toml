[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-stark-fri-prover-engine"
version = "2.0.0"
description = "ZK-STARK Fast Reed-Solomon Interactive Oracle Proof (FRI) Verification Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
zk-stark-fri-prover-engine = "zk_stark_fri.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/zk-stark-fri-prover-engine"
Repository = "https://github.com/abusuraihsakhri/zk-stark-fri-prover-engine.git"
