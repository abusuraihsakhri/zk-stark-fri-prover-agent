name: Publish browser demonstration

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "zk_stark_fri/engine.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage browser assets
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp zk_stark_fri/engine.py _site/engine.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
